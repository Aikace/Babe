name: 📊 Daily Report

on:
  schedule:
    - cron: "0 8 * * *"       # Every day at 8 AM UTC
  workflow_dispatch:

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily Discord report
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK:      ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID:      ${{ secrets.DISCORD_USER_ID }}
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "scripts")
          from db import get_stats, get_pool_summary, auto_rotate_priorities
          from discord_notify import send_daily_report

          # Run auto priority rotation (demote stale names)
          rotation = auto_rotate_priorities()
          print(f"Priority rotation: {rotation}")

          # Get stats and pool health
          stats = get_stats()
          pool  = get_pool_summary()
          print(f"Stats: {stats}")
          print(f"Pool: {pool}")

          # Send enhanced daily report
          send_daily_report(stats, pool=pool, rotation=rotation)
          print("Daily report sent!")
          EOF
