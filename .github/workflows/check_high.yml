name: ⚡ Check HIGH Priority (Peak Hours)

on:
  schedule:
    - cron: "*/15 10-16 * * *"   # Every 15 min during peak (2-8 AM PST / 10-16 UTC)
    - cron: "0,30 0-9,17-23 * * *"  # Every 30 min outside peak
  workflow_dispatch:

concurrency:
  group: check-high
  cancel-in-progress: false

jobs:
  check-high:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check HIGH priority usernames
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_WEBHOOK:      ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_USER_ID:      ${{ secrets.DISCORD_USER_ID }}
          X_BEARER_TOKEN:       ${{ secrets.X_BEARER_TOKEN }}
          IG_USERNAME:          ${{ secrets.IG_USERNAME }}
          IG_PASSWORD:          ${{ secrets.IG_PASSWORD }}
          X_USERNAME:           ${{ secrets.X_USERNAME }}
          X_API_KEY:            ${{ secrets.X_API_KEY }}
          X_API_SECRET:         ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:       ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:      ${{ secrets.X_ACCESS_SECRET }}
        run: python scripts/check_availability.py HIGH
